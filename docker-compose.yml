services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muzzzic
      POSTGRES_USER: muzzzic
      POSTGRES_PASSWORD: muzzzic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muzzzic -d muzzzic"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8001:8000"
    environment:
      POSTGRES_DB: muzzzic
      POSTGRES_USER: muzzzic
      POSTGRES_PASSWORD: muzzzic
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5174
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
